<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phản xạ đọc hiểu 4 lớp</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085; --line:#e4e7ec;
  --primary:#3157d5; --primary2:#6d4aff; --green:#0e9f6e; --green-bg:#e8f8f1;
  --red:#d92d20; --red-bg:#fef3f2; --amber:#b54708; --amber-bg:#fffaeb;
  --blue-bg:#eef4ff; --radius:18px; --shadow:0 12px 30px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:.02em;flex:0 0 auto}
.brand strong{display:block;font-size:15px;line-height:1.2}
.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav-btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:9px 13px;font-weight:700;font-size:14px}
.nav-btn:hover{border-color:#b9c7f5;background:#f8faff}
.app{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;align-items:center;margin-bottom:18px}
.hero h1{margin:6px 0 10px;font-size:38px;line-height:1.12;letter-spacing:-.03em}
.hero p{margin:0;color:var(--muted);line-height:1.65;max-width:720px}
.eyebrow{display:inline-flex;background:var(--blue-bg);color:var(--primary);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.hero-card{background:linear-gradient(135deg,#eef4ff,#f7f4ff);border:1px solid #dfe7ff;border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.hero-card strong{font-size:18px}
.hero-card p{color:#475467;font-size:14px;line-height:1.6;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
label.field{display:block;margin:0 0 14px;font-weight:700;font-size:14px;color:#344054}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--text);outline:none;margin-top:6px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(49,87,213,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;border:1px solid transparent;font-weight:800;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn.small{padding:7px 10px;border-radius:9px;font-size:12px}
.btn:hover{filter:brightness(.98)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:400;color:var(--text)}
.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.step{background:#f9fafc;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin:8px 0}
.step b{font-size:14px}
.step p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.quiz-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr);gap:18px;align-items:start}
.quiz-head{margin-bottom:14px}
.progress{height:8px;background:#e9edf5;border-radius:99px;overflow:hidden;margin-bottom:10px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px;transition:width .25s}
.quiz-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;background:#f4f6fa;color:#475467;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
.tag.easy{background:var(--green-bg);color:var(--green)}
.tag.medium{background:var(--amber-bg);color:var(--amber)}
.tag.hard{background:var(--red-bg);color:var(--red)}
.tag.retest{background:#f4f0ff;color:#6d4aff}
.passage{background:#f8faff;border:1px solid #e8eefc;border-radius:14px;padding:16px;line-height:1.65;margin-bottom:18px}
.question-card h2{font-size:22px;line-height:1.35;margin:0 0 16px}
.options{display:grid;gap:10px}
.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;transition:.15s;color:var(--text)}
.option:hover{border-color:#b9c7f5;background:#f9fbff;transform:translateY(-1px)}
.option .letter{flex:0 0 28px;height:28px;border-radius:9px;background:#eef2ff;color:#3157d5;display:grid;place-items:center;font-weight:800;font-size:13px}
.option.correct{border-color:var(--green);background:var(--green-bg)}
.option.correct .letter{background:var(--green);color:#fff}
.option.wrong{border-color:var(--red);background:var(--red-bg)}
.option.wrong .letter{background:var(--red);color:#fff}
.option:disabled{opacity:1;cursor:default}
.reflection-card{position:sticky;top:88px}
.reflection-card h3{margin-top:0}
.reflection-card .field{margin-bottom:12px;font-size:13px}
.layers{display:grid;gap:8px;margin-top:8px}
.layer{display:flex;gap:10px;align-items:flex-start;background:#f9fafc;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-weight:400}
.layer input{width:16px;height:16px;margin-top:2px}
.feedback{border-radius:14px;padding:16px;margin-top:16px;border:1px solid var(--line);background:#f9fafc}
.feedback.ok{background:var(--green-bg);border-color:#b9e7d4}
.feedback.bad{background:var(--red-bg);border-color:#f3b8b3}
.fb-title{font-weight:900;font-size:17px;margin-bottom:10px}
.feedback p{margin:7px 0;line-height:1.55}
.next-actions{margin-top:16px;display:flex;justify-content:flex-end}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stat{background:#f9fafc;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.stat strong{font-size:24px}
.score-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:150px;height:150px;border-radius:50%;background:#eef4ff;border:6px solid #fff;box-shadow:var(--shadow)}
.score-badge.pass{background:var(--green-bg);color:var(--green)}
.score-badge.fail{background:var(--red-bg);color:var(--red)}
.score-badge span{font-size:34px;font-weight:900}
.score-badge small{font-size:13px}
.result-header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f8fafc;color:#475467;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.mini-stat{margin:10px 0}
.mini-stat > div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
.bar{height:7px;background:#e9edf5;border-radius:99px;overflow:hidden}
.bar > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2))}
.small{color:var(--muted);font-size:12px}
.code-area{width:100%;min-height:90px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
details{margin-top:12px}
summary{cursor:pointer;font-weight:800;color:var(--primary)}
.empty{text-align:center;padding:30px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#172033;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){
  .hero,.grid-2,.quiz-grid{grid-template-columns:1fr}
  .hero h1{font-size:30px}
  .reflection-card{position:static}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .result-header{flex-direction:column;align-items:flex-start}
}
@media(max-width:560px){
  .app{padding:16px 10px 40px}
  .card{padding:16px}
  .topbar{padding:10px 12px}
  .brand span{display:none}
  .stats-grid{grid-template-columns:1fr 1fr}
  .score-badge{width:120px;height:120px}
  .option{padding:11px}
}
@media print{
  body{background:#fff}
  .topbar,.toolbar,.btn,.toast{display:none!important}
  .card{box-shadow:none;border-color:#ddd;break-inside:avoid}
  .app{max-width:none;padding:0}
  .table-wrap{overflow:visible}
}
.hidden{display:none}
@media print{
  body.print-result *{visibility:hidden}
  body.print-result #resultCard, body.print-result #resultCard *{visibility:visible}
  body.print-result #resultCard{position:absolute;left:0;top:0;width:100%;box-shadow:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">4L</div>
    <div>
      <strong>Phản xạ đọc hiểu</strong>
      <span>Học sinh luyện – Giáo viên nhận báo cáo</span>
    </div>
  </div>
  <nav class="nav">
    <button class="nav-btn" onclick="showSetup()">Luyện tập</button>
    <button class="nav-btn" onclick="showTeacher()">Báo cáo giáo viên</button>
  </nav>
</header>

<main class="app" id="app"></main>
<div class="toast" id="toast"></div>

<script>
const app = document.getElementById("app");

/* =========================================================
   1. DỮ LIỆU 20 CÂU CHUẨN
   ========================================================= */
const QUESTION_BANK = [
  {
    id:"10_FL_01", theme:"Family Life & Daily Routines", diff:"Dễ", target:45,
    passage:"In Mr. Brown’s family, both parents share housework equally. Every evening, Mr. Brown cooks dinner while his wife cleans the living room. Their children, Tom and Anna, help by washing the dishes after meals. This routine helps them build a strong family bond.",
    question:"What do Tom and Anna do in the family routine?",
    options:[
      "They cook dinner every evening.",
      "They clean the living room with their mother.",
      "They wash the dishes after meals.",
      "They share all housework equally with their parents."
    ],
    answer:2,
    qtype:"What", infoType:"Hành động/Sự kiện",
    evidence:"children, Tom and Anna, help by washing the dishes",
    traps:["Đảo chủ thể","Chi tiết lạc đề"],
    elimination:"A sai vì Mr. Brown nấu ăn. B sai vì vợ ông Brown dọn phòng khách. D sai vì bố mẹ chia việc nhà, còn hai con chỉ giúp rửa bát.",
    strategy:"Quét từ khóa 'Tom and Anna', khoanh chủ thể, đối chiếu hành động chính xác.",
    layerFocus:"L1 Chủ thể"
  },
  {
    id:"10_FL_02", theme:"Family Life & Daily Routines", diff:"Trung bình", target:60,
    passage:"Teenagers often need about 8 to 10 hours of sleep each night to support their rapid physical growth. However, a recent survey shows that nearly 70% of high school students in the city sleep less than 7 hours because of heavy school workloads and late-night smartphone use.",
    question:"According to the survey, why do most urban high school students sleep less than 7 hours?",
    options:[
      "Because they suffer from severe physical growth problems.",
      "Because of heavy school workloads and using smartphones late at night.",
      "Because they always prefer sleeping 8 to 10 hours a night.",
      "Because school workloads prevent them from growing physically."
    ],
    answer:1,
    qtype:"Why", infoType:"Nguyên nhân/Mục đích",
    evidence:"because of heavy school workloads and late-night smartphone use",
    traps:["Đảo nguyên nhân–kết quả","Tuyệt đối hóa"],
    elimination:"A đảo ngược nhân quả. C dùng 'always' tuyệt đối hóa và mâu thuẫn với việc ngủ ít. D sai ý so với bài.",
    strategy:"Xác định 'why' → tìm cụm 'because of...' → kiểm tra 4 lớp.",
    layerFocus:"L4 Mục đích/Nguyên nhân"
  },
  {
    id:"10_FL_03", theme:"Family Life & Daily Routines", diff:"Trung bình", target:60,
    passage:"Last weekend, Linda’s family planned to visit her grandparents in the countryside. Unfortunately, heavy rain forced them to cancel the trip. Instead, they stayed home and cooked a traditional meal together, which turned out to be a wonderful bonding experience.",
    question:"What did Linda’s family actually do last weekend?",
    options:[
      "They successfully visited her grandparents in the countryside.",
      "They traveled to the countryside despite the heavy rain.",
      "They stayed at home and cooked a traditional meal together.",
      "They had to cancel all their weekend plans without doing anything."
    ],
    answer:2,
    qtype:"What", infoType:"Thời gian/Trạng thái",
    evidence:"Instead, they stayed home and cooked a traditional meal together",
    traps:["Đảo thời gian","Sự kiện trái ngược"],
    elimination:"A, B nhắc kế hoạch ban đầu nhưng đã bị hủy do mưa. D sai vì họ vẫn ở nhà nấu ăn cùng nhau, không phải 'không làm gì'.",
    strategy:"Lưu ý từ chuyển ý 'Instead' (thay vào đó) để bắt sự kiện thực tế.",
    layerFocus:"L2 Thời gian/Trạng thái"
  },
  {
    id:"10_FL_04", theme:"Family Life & Daily Routines", diff:"Khó", target:75,
    passage:"Although many parents believe that pocket money teaches children financial independence, some experts argue that giving too much cash without guidance may lead to bad spending habits and weaken responsibility.",
    question:"What is the experts' view on giving children pocket money?",
    options:[
      "It always guarantees that children will become financially independent.",
      "It never causes any negative effects if given in large amounts.",
      "It may result in poor spending habits if children receive too much without proper guidance.",
      "It completely destroys children's sense of responsibility in all cases."
    ],
    answer:2,
    qtype:"What", infoType:"Phạm vi/Mức độ",
    evidence:"may lead to bad spending habits and weaken responsibility... without guidance",
    traps:["Tuyệt đối hóa"],
    elimination:"A dùng 'always' sai mức độ so với 'may'. B dùng 'never' trái ngược với ý cảnh báo. D dùng 'completely... in all cases' là tuyệt đối hóa phạm vi.",
    strategy:"Chú ý từ chỉ mức độ/khả năng (may, might, can) để loại đáp án tuyệt đối (always, never, all).",
    layerFocus:"L3 Phạm vi/Mức độ"
  },
  {
    id:"10_FL_05", theme:"Family Life & Daily Routines", diff:"Trung bình", target:60,
    passage:"Sharing housework helps children develop essential life skills. When children take part in cooking or cleaning, they learn how to take care of themselves when they live independently in the future.",
    question:"What is the primary benefit of sharing housework for children mentioned in the text?",
    options:[
      "It helps them earn extra pocket money from their parents.",
      "It teaches them essential life skills for future independent living.",
      "It ensures they never have to do chores when they grow up.",
      "It allows them to finish schoolwork much faster every day."
    ],
    answer:1,
    qtype:"What", infoType:"Nguyên nhân/Mục đích",
    evidence:"help children develop essential life skills... live independently in the future",
    traps:["Chi tiết ngoài bài"],
    elimination:"A, D không xuất hiện trong đoạn. C mâu thuẫn với việc học kỹ năng tự lập để tự lo sau này.",
    strategy:"Đối chiếu câu hỏi 'primary benefit' với câu chủ đề của đoạn.",
    layerFocus:"L4 Mục đích"
  },
  {
    id:"10_HE_01", theme:"Humans & Environment / Green Living", diff:"Dễ", target:45,
    passage:"Green living involves making lifestyle choices that protect the environment. A simple way to start is by reducing plastic waste. Many local stores now offer reusable bags instead of single-use plastic bags to shoppers.",
    question:"What are local stores doing to help reduce plastic waste?",
    options:[
      "They are banning shoppers from entering stores.",
      "They are offering reusable bags instead of single-use plastic bags.",
      "They are forcing shoppers to buy plastic bags every day.",
      "They are producing single-use plastic bags for customers."
    ],
    answer:1,
    qtype:"What", infoType:"Hành động/Sự kiện",
    evidence:"offer reusable bags instead of single-use plastic bags",
    traps:["Đảo ngược thông tin","Trái nghĩa"],
    elimination:"A, C, D bịa đặt hoặc đảo ngược việc cửa hàng cung cấp túi tái sử dụng thay túi nhựa dùng một lần.",
    strategy:"Quét 'local stores' → đọc kỹ cụm 'instead of'.",
    layerFocus:"L1 Chủ thể"
  },
  {
    id:"10_HE_02", theme:"Humans & Environment / Green Living", diff:"Trung bình", target:60,
    passage:"In an effort to reduce carbon footprints, the local government announced that all public buses will switch from diesel to electric power by next year. Currently, engineers are testing the new charging stations across the city.",
    question:"What is the current status of the public buses according to the text?",
    options:[
      "They have already completed the switch to electric power.",
      "They are currently running entirely on diesel power while engineers test charging stations.",
      "They will stop operating completely until next year.",
      "They are being manufactured by engineers in the city center."
    ],
    answer:1,
    qtype:"What", infoType:"Thời gian/Trạng thái",
    evidence:"will switch... by next year. Currently, engineers are testing...",
    traps:["Đảo thời gian"],
    elimination:"A sai thì (tương lai vs đã hoàn thành). C không có thông tin ngừng hoạt động. D sai chi tiết (kỹ sư kiểm tra trạm sạc, không sản xuất xe).",
    strategy:"Kiểm tra L2: phân biệt 'by next year' (tương lai) và 'Currently' (hiện tại).",
    layerFocus:"L2 Thời gian/Trạng thái"
  },
  {
    id:"10_HE_03", theme:"Humans & Environment / Green Living", diff:"Khó", target:75,
    passage:"Planting trees in urban areas is often praised as an effective way to lower temperatures. However, researchers note that trees only provide significant cooling benefits if they are mature and planted in large, continuous clusters rather than isolated spots.",
    question:"Under what condition do urban trees provide significant cooling benefits?",
    options:[
      "If they are planted anywhere in isolated spots across the city.",
      "Unless they are young saplings planted by local residents.",
      "Only if they are mature and planted in large, continuous clusters.",
      "Provided that the city temperature is extremely high."
    ],
    answer:2,
    qtype:"What", infoType:"Điều kiện",
    evidence:"only provide significant cooling benefits if they are mature and planted in large, continuous clusters rather than isolated spots",
    traps:["Đảo điều kiện","Trái nghĩa nội dung"],
    elimination:"A trái với 'rather than isolated spots'. B dùng 'unless' và 'young saplings' sai điều kiện (bài: mature). D thêm điều kiện ngoài bài.",
    strategy:"Nhận diện từ nối điều kiện (only if, if, unless) để tránh bẫy đảo điều kiện.",
    layerFocus:"L3 Phạm vi/Mức độ"
  },
  {
    id:"10_HE_04", theme:"Humans & Environment / Green Living", diff:"Trung bình", target:60,
    passage:"Eco-friendly packaging has become a major trend among supermarket chains. While some critics argue that it increases product prices, most consumers are willing to pay extra because they care deeply about ocean conservation.",
    question:"Why are most consumers willing to pay extra for eco-friendly packaging?",
    options:[
      "Because prices at supermarkets have decreased significantly.",
      "Because they care deeply about ocean conservation.",
      "Because critics forced supermarkets to raise product prices.",
      "Because they want to test new packaging trends."
    ],
    answer:1,
    qtype:"Why", infoType:"Nguyên nhân/Mục đích",
    evidence:"because they care deeply about ocean conservation",
    traps:["Đảo mục đích","Chi tiết lạc đề"],
    elimination:"A mâu thuẫn (giá tăng). C sai chủ thể (nhà phê bình không ép người tiêu dùng). D không phải động lực chính.",
    strategy:"Tìm 'because' đi kèm đối tượng 'consumers'.",
    layerFocus:"L4 Mục đích"
  },
  {
    id:"10_HE_05", theme:"Humans & Environment / Green Living", diff:"Trung bình", target:60,
    passage:"Renewable energy sources like solar and wind power are expanding rapidly. In 2025, solar energy supplied nearly 30% of the total electricity in the region, making it the fastest-growing clean energy source.",
    question:"What was true about solar energy in the region in 2025?",
    options:[
      "It supplied all the electricity needed by local residents.",
      "It supplied nearly 30% of the total electricity and grew the fastest.",
      "It was replaced entirely by wind power during the year.",
      "It provided less electricity than any other energy source."
    ],
    answer:1,
    qtype:"What", infoType:"Phạm vi/Mức độ",
    evidence:"supplied nearly 30% of the total electricity... fastest-growing",
    traps:["Đảo phạm vi","Tuyệt đối hóa"],
    elimination:"A dùng 'all' sai, bài chỉ 'nearly 30%'. C, D sai lệch hoàn toàn so với thông tin.",
    strategy:"Kiểm tra L3: 'nearly 30%' không phải 'all'.",
    layerFocus:"L3 Phạm vi/Mức độ"
  },
  {
    id:"10_MA_01", theme:"Music, Arts & Community Development", diff:"Dễ", target:45,
    passage:"Music plays an essential role in teenagers' emotional development. Listening to upbeat songs can boost their mood after a stressful school day, while calming melodies help them relax before bedtime.",
    question:"What do calming melodies help teenagers do?",
    options:[

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function selected(value, current){
  return String(value) === String(current) ? "selected" : "";
}

function checked(arr, val){
  return (arr || []).includes(String(val)) ? "checked" : "";
}

function formatTime(sec){
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function formatDate(iso){
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString("vi-VN", {
    hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit", year:"numeric"
  });
}

function diffClass(diff){
  const d = String(diff || "").toLowerCase();
  if (d.includes("dễ") || d.includes("easy")) return "easy";
  if (d.includes("trung") || d.includes("medium")) return "medium";
  if (d.includes("khó") || d.includes("hard")) return "hard";
  return "retest";
}

function showToast(msg){
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

function copyText(text){
  if (!text) return;
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(() => showToast("Đã sao chép"))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); showToast("Đã sao chép"); }
  catch(e){ showToast("Không thể sao chép tự động"); }
  ta.remove();
}

function getPrefs(){
  try {
    return JSON.parse(localStorage.getItem("phx_user_v1") || "{}");
  } catch(e){
    return {};
  }
}

function savePrefs(student, className){
  try {
    localStorage.setItem("phx_user_v1", JSON.stringify({student, className}));
  } catch(e){}
}

function getResults(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return memoryResults;
}

function saveResults(arr){
  memoryResults = arr;
  try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch(e){}
}

function saveResult(result){
  const arr = getResults();
  const idx = arr.findIndex(x => x.id === result.id);
  if (idx >= 0) arr[idx] = result;
  else arr.push(result);
  saveResults(arr);
}

/* =========================================================
   6. MÃ HÓA KẾT QUẢ ĐỂ GỬI GIÁO VIÊN
   ========================================================= */
function b64urlEncodeUtf8(str){
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  for (const b of bytes) binary += String.fromCharCode(b);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function b64urlDecodeUtf8(code){
  let base64 = code.replace(/-/g, "+").replace(/_/g, "/");
  while (base64.length % 4) base64 += "=";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function encodeResult(obj){
  const copy = { ...obj };
  delete copy.code;
  return "PHX1." + b64urlEncodeUtf8(JSON.stringify(copy));
}

function decodeResult(code){
  if (typeof code !== "string" || !code.startsWith("PHX1.")) throw new Error("bad code");
  const obj = JSON.parse(b64urlDecodeUtf8(code.slice(5)));
  if (!obj || !Array.isArray(obj.answers) || !obj.student) throw new Error("bad result");
  return obj;
}

function beginQuiz(opts = {}){
  stopTimer();
  const mode = opts.mode || "practice";
  const student = opts.student || "Học sinh";
  const className = opts.className || "Chưa rõ";
  const requireReflection = opts.requireReflection !== false;
  const questions = opts.questions && opts.questions.length ? opts.questions : getQuestions(mode);

  state = {
    mode,
    student,
    className,
    requireReflection,
    questions,
    current: 0,
    answers: [],
    reflections: {},
    start: Date.now(),
    timerId: null,
    answered: false,
    finished: false,
    qStart: 0,
    modeLabel: MODE_LABELS[mode] || mode
  };

  savePrefs(student, className);
  renderQuiz();
}

function startQuiz(){
  const name = document.getElementById("studentName")?.value.trim() || "Học sinh";
  const className = document.getElementById("className")?.value.trim() || "Chưa rõ";
  const mode = document.getElementById("mode")?.value || "practice";

  beginQuiz({ mode, student: name, className, requireReflection });
}

function getQuestions(mode){
  if (mode === "retest24") return RETEST_24H;

  if (mode === "personal") return PERSONAL;

}

            <span><b>L4 Mục đích câu hỏi</b><br>Đúng ý hỏi hay đúng nhưng lạc đề?</span>
          </label>
        </div>
      </aside>
    </div>
  `;

  bindQuizEvents();
  startTimer();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function bindQuizEvents(){
  document.querySelectorAll(".option").forEach((el, idx) => {
    el.addEventListener("click", () => selectOption(idx));
  });

  ["qtype", "infoType", "evidence"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", saveReflection);
  });

  document.querySelectorAll("[data-layer]").forEach(cb => {
    cb.addEventListener("change", saveReflection);
  });
}

function getReflectionFromDom(){
  return {
    qtype: document.getElementById("qtype")?.value || "",
    infoType: document.getElementById("infoType")?.value || "",
    evidence: (document.getElementById("evidence")?.value || "").trim(),
    layers: Array.from(document.querySelectorAll("[data-layer]:checked")).map(el => el.dataset.layer)
  };
}

function saveReflection(){
  if (!state || !state.questions) return;
  const q = state.questions[state.current];
  if (!q) return;
  state.reflections[q.id] = getReflectionFromDom();
}

function isReflectionComplete(ref){
  return !!(
    ref.qtype &&
    ref.infoType &&
    ref.evidence &&
    ref.evidence.length >= 2 &&
    Array.isArray(ref.layers) &&
    ref.layers.length === 4
  );
}

function selectOption(idx){
  if (!state || state.answered) return;
  const q = state.questions[state.current];
  if (!q) return;

  const ref = getReflectionFromDom();
  state.reflections[q.id] = ref;

  if (state.requireReflection && !isReflectionComplete(ref)){
    if (!ref.qtype) showToast("Bước 1: chọn từ hỏi (Who/What/Why...)");
    else if (!ref.infoType) showToast("Bước 2: chọn loại thông tin cần tìm");
    else if (ref.evidence.length < 2) showToast("Bước 3: ghi cụm từ khóa/bằng chứng");
    else showToast("Bước 4: đánh dấu đủ 4 lớp kiểm tra");
    return;
  }

  const correct = idx === q.answer;
  state.answered = true;
  stopTimer();

  const elapsed = Math.floor((Date.now() - state.qStart) / 1000);
  const answer = {
    qid: q.id,
    selected: idx,
    correct,
    elapsed,
    qtype: ref.qtype,
    infoType: ref.infoType,
    evidence: ref.evidence,
    layers: ref.layers,
    reflectionRequired: state.requireReflection,
    reflectionDone: state.requireReflection ? true : null
  };

  state.answers.push(answer);
  state.reflections[q.id] = ref;

  document.querySelectorAll(".option").forEach((el, i) => {
    el.disabled = true;
    if (i === q.answer) el.classList.add("correct");
    if (i === idx && !correct) el.classList.add("wrong");
  });

  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (correct ? "ok" : "bad");
  fb.innerHTML = renderFeedback(q, correct);

  document.getElementById("nextActions").innerHTML = `
    <button class="btn primary" onclick="nextQuestion()">
      ${state.current === state.questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo"}
    </button>
  `;

  document.querySelectorAll("#reflectionPanel input, #reflectionPanel select").forEach(el => el.disabled = true);

  const progress = document.querySelector(".progress > div");
  if (progress) progress.style.width = `${((state.current + 1) / state.questions.length) * 100}%`;
}

function renderFeedback(q, correct){
  const correctLetter = String.fromCharCode(65 + q.answer);
  return `
    <div class="fb-title">${correct ? "✓ Chính xác" : "✗ Chưa đúng"}</div>
    <p><strong>Đáp án đúng:</strong> ${correctLetter}. ${escapeHtml(q.options[q.answer])}</p>
    <p><strong>Bằng chứng:</strong> “${escapeHtml(q.evidence)}”</p>
    <p><strong>Bẫy:</strong> ${escapeHtml(q.traps.join(" • "))}</p>
    <p><strong>Loại trừ:</strong> ${escapeHtml(q.elimination)}</p>
    <p><strong>Chiến lược:</strong> ${escapeHtml(q.strategy)}</p>
    <p><strong>Lớp quyết định:</strong> ${escapeHtml(q.layerFocus)}</p>
  `;
}

function nextQuestion(){
  if (!state) return;
  stopTimer();
  if (state.current >= state.questions.length - 1){
    finishQuiz();
    return;
  }
  state.current++;
  state.answered = false;
  renderQuiz();
}

/* =========================================================
   9. TÍNH TOÁN & KẾT QUẢ HỌC SINH
   ========================================================= */
function computeStats(result){
  const stats = {
    byDiff: {},
    byTrap: {},
    byTheme: {},
    reflectionReq: 0,
    reflectionDone: 0
  };

  (result.answers || []).forEach(a => {
    const q = QMAP[a.qid];
    if (!q) return;

    const d = q.diff || "Khác";
    stats.byDiff[d] = stats.byDiff[d] || { total: 0, correct: 0 };
    stats.byDiff[d].total++;
    if (a.correct) stats.byDiff[d].correct++;

    const t = q.theme || "Khác";
    stats.byTheme[t] = stats.byTheme[t] || { total: 0, correct: 0 };
    stats.byTheme[t].total++;
    if (a.correct) stats.byTheme[t].correct++;

    (q.traps || []).forEach(trap => {
      stats.byTrap[trap] = stats.byTrap[trap] || { total: 0, wrong: 0 };
      stats.byTrap[trap].total++;
      if (!a.correct) stats.byTrap[trap].wrong++;
    });

    if (a.reflectionRequired){
      stats.reflectionReq++;
      if (a.reflectionDone) stats.reflectionDone++;
    }
  });

  return stats;
}

function miniStat(label, total, correct){
  const pct = total ? Math.round(correct / total * 100) : 0;
  return `
    <div class="mini-stat">
      <div><span>${escapeHtml(label)}</span><strong>${pct}%</strong></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="small">${correct}/${total} câu</div>
    </div>
  `;
}

function finishQuiz(){
  stopTimer();
  if (!state) return;
  state.finished = true;

  const total = state.questions.length;
  const correctCount = state.answers.filter(a => a.correct).length;
  const durationSec = state.answers.reduce((sum, a) => sum + (a.elapsed || 0), 0);

  const result = {
    id: "r_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    student: state.student,
    className: state.className,
    mode: state.mode,
    modeLabel: state.modeLabel,
    dateISO: new Date().toISOString(),
    score: correctCount,
    total,
    percent: total ? Math.round(correctCount / total * 100) : 0,
    durationSec,
    answers: state.answers.slice()
  };

  result.code = encodeResult(result);
  lastResult = result;
  saveResult(result);
  renderResult(result);
}

   ========================================================= */
function startRetestFromResult(){
  if (!lastResult) return;
  const wrong = (lastResult.answers || []).filter(a => !a.correct);
  const wrongQs = wrong.map(a => QMAP[a.qid]).filter(Boolean);
  const traps = new Set(wrongQs.flatMap(q => q.traps || []));

  let set = RETEST_24H.filter(q => (q.traps || []).some(t => traps.has(t)));
  if (set.length === 0) set = RETEST_24H.slice();

  beginQuiz({
    mode: "retest24",
    student: lastResult.student,
    className: lastResult.className,
    requireReflection: true,
    questions: set
  });
}

function startRetest7FromResult(){
  if (!lastResult) return;
  beginQuiz({
    mode: "retest7",
    student: lastResult.student,
    className: lastResult.className,
    requireReflection: true
  });
}

function startPersonalFromResult(){
  if (!lastResult) return;
  beginQuiz({
    mode: "personal",
    student: lastResult.student,
    className: lastResult.className,
    requireReflection: true
  });
}

function downloadLastResult(){
  if (lastResult) downloadResult(lastResult);
}

function copyLastResult(){
  if (lastResult) copyText(lastResult.code || encodeResult(lastResult));
}

function downloadResult(r){
  if (!r) return;
  const blob = new Blob([JSON.stringify(r, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const safeName = String(r.student || "hoc-sinh").replace(/\s+/g, "-");
  a.href = URL.createObjectURL(blob);
  a.download = `ket-qua-${safeName}-${r.id || "result"}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast("Đã tải JSON");
}

/* =========================================================
   11. BÁO CÁO GIÁO VIÊN
   ========================================================= */
function aggregateResults(results){
  const stats = {
    attempts: results.length,
    totalPercent: 0,
    passCount: 0,
    avg: 0,
    passRate: 0,
    traps: {},
    questions: {},
    themes: {},
    reflectionReq: 0,
    reflectionDone: 0
  };

  results.forEach(r => {
    const pct = Number(r.percent) || 0;
    stats.totalPercent += pct;
    if (pct >= 80) stats.passCount++;

    (r.answers || []).forEach(a => {
      const q = QMAP[a.qid];
      if (!q) return;

      const qt = stats.questions[a.qid] || { total: 0, correct: 0, diff: q.diff, theme: q.theme };
      qt.total++;
      if (a.correct) qt.correct++;
      stats.questions[a.qid] = qt;

      const th = stats.themes[q.theme] || { total: 0, correct: 0 };
      th.total++;
      if (a.correct) th.correct++;
      stats.themes[q.theme] = th;

      (q.traps || []).forEach(trap => {
        const tr = stats.traps[trap] || { total: 0, wrong: 0 };
        tr.total++;
        if (!a.correct) tr.wrong++;
        stats.traps[trap] = tr;
      });

      if (a.reflectionRequired){
        stats.reflectionReq++;
        if (a.reflectionDone) stats.reflectionDone++;
      }
    });
  });

  stats.avg = results.length ? Math.round(stats.totalPercent / results.length) : 0;
  stats.passRate = results.length ? Math.round(stats.passCount / results.length * 100) : 0;
  return stats;
}

              <th>Điểm</th>
              <th>Thời gian</th>
              <th>Sai</th>
              <th>Phiếu</th>
              <th>Mã</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml || `<tr><td colspan="10" class="empty">Chưa có kết quả. Học sinh làm bài rồi gửi mã cho giáo viên.</td></tr>`}
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Phổ bẫy yếu của lớp</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Loại bẫy</th><th>Sai/Tổng cơ hội</th><th>Độ chính xác</th></tr></thead>
          <tbody>
            ${trapRows || `<tr><td colspan="3" class="empty">Chưa có dữ liệu.</td></tr>`}
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Câu hỏi cần dạy lại</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Mã câu</th><th>Câu hỏi</th><th>Độ khó</th><th>%</th><th>Đúng/Tổng</th></tr>
          </thead>
          <tbody>
            ${qRows || `<tr><td colspan="5" class="empty">Chưa có dữ liệu.</td></tr>`}
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Theo chủ đề</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Chủ đề</th><th>Đúng/Tổng</th><th>%</th></tr></thead>
          <tbody>${themeRows || `<tr><td colspan="3" class="empty">Chưa có dữ liệu.</td></tr>`}</tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Nhập mã kết quả từ học sinh</h2>
      <p class="small">
        Học sinh bấm “Sao chép mã” ở phiếu kết quả và gửi cho giáo viên.
        Dán mã bắt đầu bằng <b>PHX1.</b> vào ô dưới.
      </p>
      <textarea class="code-area" id="importCode" placeholder="Dán mã PHX1..."></textarea>
      <div class="toolbar" style="margin-top:10px">
        <button class="btn primary" onclick="importResult()">Nhập mã kết quả</button>
      </div>
      <p class="small">
        Nếu cùng một trình duyệt/máy, kết quả tự lưu và đã xuất hiện trong bảng trên.
      </p>
    </section>
  `;
}

function setTeacherClass(v){
  teacherClass = v;
  renderTeacher();
}

function copyResultByIndex(i){
  const r = teacherFiltered[i];
  if (!r) return;
  copyText(r.code || encodeResult(r));
}

function importResult(){
  const ta = document.getElementById("importCode");
  if (!ta) return;
  const code = ta.value.trim();
  if (!code){ showToast("Chưa có mã để nhập"); return; }

  try {
    const obj = decodeResult(code);
    obj.id = obj.id || "imp_" + Date.now();
    obj.code = code;

    const arr = getResults();
    const idx = arr.findIndex(x => x.id === obj.id);
    if (idx >= 0) arr[idx] = obj;
    else arr.push(obj);

    saveResults(arr);
    ta.value = "";
    renderTeacher();
    showToast("Đã nhập kết quả");
  } catch(e){
    showToast("Mã kết quả không hợp lệ");
  }
}

function exportCSV(){
  const data = teacherFiltered.length ? teacherFiltered : getResults();
  const rows = [
    ["Mã", "Ngày", "Học sinh", "Lớp", "Chế độ", "Điểm", "Tổng", "%", "Thời gian(s)", "Sai", "Phiếu phản xạ"]
  ];

  data.forEach(r => {
    const total = Number(r.total) || (r.answers || []).length || 0;
    const score = Number(r.score) || 0;
    const req = (r.answers || []).filter(a => a.reflectionRequired).length;
    const done = (r.answers || []).filter(a => a.reflectionRequired && a.reflectionDone).length;
    rows.push([
      r.id || "",
      formatDate(r.dateISO),
      r.student || "",
      r.className || "",
      r.modeLabel || MODE_LABELS[r.mode] || r.mode || "",
      score,
      total,
      Number(r.percent) || 0,
      Number(r.durationSec) || 0,
      Math.max(0, total - score),
      req ? `${done}/${req}` : "—"
    ]);
  });

  const csv = rows.map(row =>
    row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")
  ).join("\n");

  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `bao-cao-phan-xa-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast("Đã xuất CSV");
}

function clearResults(){
  if (!confirm("Xóa toàn bộ kết quả đã lưu trên trình duyệt này?")) return;
  try { localStorage.removeItem(LS_KEY); } catch(e){}
  memoryResults = [];
  teacherClass = "";
  renderTeacher();
  showToast("Đã xóa dữ liệu");
}

/* =========================================================
   12. ĐIỀU HƯỚNG & KHỞI TẠO
   ========================================================= */
function showSetup(){
  if (state && !state.finished && state.answers && state.answers.length > 0){
    if (!confirm("Bạn đang làm dở. Về màn hình bắt đầu sẽ mất tiến độ. Tiếp tục?")) return;
  }
  stopTimer();
  state = { finished: true };
  renderSetup();
}

function stopTimer(){
  if (state && state.timerId){
    clearInterval(state.timerId);
    state.timerId = null;
  }
}

function startTimer(){
  stopTimer();
  state.qStart = Date.now();
  updateTimer();
  state.timerId = setInterval(updateTimer, 1000);
}

function updateTimer(){
  if (!state || !state.qStart) return;
  const sec = Math.floor((Date.now() - state.qStart) / 1000);
  const el = document.getElementById("timer");
  if (el) el.textContent = formatTime(sec);
}

/* Khởi chạy */
renderSetup();
function exportPDF(){
  document.body.classList.add('print-result');
  window.print();
  setTimeout(()=>document.body.classList.remove('print-result'),500);
}
</script>
</body>

<script>
const app = document.getElementById("app");

/* =========================================================
   1. DỮ LIỆU 20 CÂU CHUẨN
   ========================================================= */
const QUESTION_BANK = [
  {
    id:"10_FL_01", theme:"Family Life & Daily Routines", diff:"Dễ", target:45,
    passage:"In Mr. Brown’s family, both parents share housework equally. Every evening, Mr. Brown cooks dinner while his wife cleans the living room. Their children, Tom and Anna, help by washing the dishes after meals. This routine helps them build a strong family bond.",

    options:[
      "They cook dinner every evening.",
      "They clean the living room with their mother.",
      "They wash the dishes after meals.",
      "They share all housework equally with their parents."
    ],
    answer:2,
    qtype:"What", infoType:"Hành động/Sự kiện",
    evidence:"children, Tom and Anna, help by washing the dishes",
    traps:["Đảo chủ thể","Chi tiết lạc đề"],
    elimination:"A sai vì Mr. Brown nấu ăn. B sai vì vợ ông Brown dọn phòng khách. D sai vì bố mẹ chia việc nhà, còn hai con chỉ giúp rửa bát.",
    strategy:"Quét từ khóa 'Tom and Anna', khoanh chủ thể, đối chiếu hành động chính xác.",
    layerFocus:"L1 Chủ thể"
  },
  {
    id:"10_FL_02", theme:"Family Life & Daily Routines", diff:"Trung bình", target:60,
    passage:"Teenagers often need about 8 to 10 hours of sleep each night to support their rapid physical growth. However, a recent survey shows that nearly 70% of high school students in the city sleep less than 7 hours because of heavy school workloads and late-night smartphone use.",

      "Because they suffer from severe physical growth problems.",
      "Because of heavy school workloads and using smartphones late at night.",
      "Because they always prefer sleeping 8 to 10 hours a night.",
      "Because school workloads prevent them from growing physically."
    ],
    answer:1,
    qtype:"Why", infoType:"Nguyên nhân/Mục đích",
    evidence:"because of heavy school workloads and late-night smartphone use",
    traps:["Đảo nguyên nhân–kết quả","Tuyệt đối hóa"],
    elimination:"A đảo ngược nhân quả. C dùng 'always' tuyệt đối hóa và mâu thuẫn với việc ngủ ít. D sai ý so với bài.",
    strategy:"Xác định 'why' → tìm cụm 'because of...' → kiểm tra 4 lớp.",
    layerFocus:"L4 Mục đích/Nguyên nhân"

  {
    id:"10_FL_03", theme:"Family Life & Daily Routines", diff:"Trung bình", target:60,

      "They successfully visited her grandparents in the countryside.",
      "They traveled to the countryside despite the heavy rain.",
      "They stayed at home and cooked a traditional meal together.",
      "They had to cancel all their weekend plans without doing anything."
    ],
    answer:2,
    qtype:"What", infoType:"Thời gian/Trạng thái",
    evidence:"Instead, they stayed home and cooked a traditional meal together",
    traps:["Đảo thời gian","Sự kiện trái ngược"],
    elimination:"A, B nhắc kế hoạch ban đầu nhưng đã bị hủy do mưa. D sai vì họ vẫn ở nhà nấu ăn cùng nhau, không phải 'không làm gì'.",
    strategy:"Lưu ý từ chuyển ý 'Instead' (thay vào đó) để bắt sự kiện thực tế.",
    layerFocus:"L2 Thời gian/Trạng thái"
  },
  {
    id:"10_FL_04", theme:"Family Life & Daily Routines", diff:"Khó", target:75,
    passage:"Although many parents believe that pocket money teaches children financial independence, some experts argue that giving too much cash without guidance may lead to bad spending habits and weaken responsibility.",
    question:"What is the experts' view on giving children pocket money?",
    options:[
      "It always guarantees that children will become financially independent.",
      "It never causes any negative effects if given in large amounts.",
      "It may result in poor spending habits if children receive too much without proper guidance.",
      "It completely destroys children's sense of responsibility in all cases."
    ],
    answer:2,
    qtype:"What", infoType:"Phạm vi/Mức độ",
    evidence:"may lead to bad spending habits and weaken responsibility... without guidance",

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function selected(value, current){
  return String(value) === String(current) ? "selected" : "";
}

function checked(arr, val){
  return (arr || []).includes(String(val)) ? "checked" : "";
}

function formatTime(sec){
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function formatDate(iso){
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString("vi-VN", {
    hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit", year:"numeric"
  });
}

function diffClass(diff){
  const d = String(diff || "").toLowerCase();
  if (d.includes("dễ") || d.includes("easy")) return "easy";
  if (d.includes("trung") || d.includes("medium")) return "medium";
  if (d.includes("khó") || d.includes("hard")) return "hard";
  return "retest";
}

function showToast(msg){
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 2600);
}

function copyText(text){
  if (!text) return;
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(() => showToast("Đã sao chép"))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); showToast("Đã sao chép"); }
  catch(e){ showToast("Không thể sao chép tự động"); }
  ta.remove();
}

function getPrefs(){

  }
}

function savePrefs(student, className){

}

function getResults(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return memoryResults;
}

function saveResults(arr){
  memoryResults = arr;
  try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch(e){}
}

function saveResult(result){
  const arr = getResults();
  const idx = arr.findIndex(x => x.id === result.id);
  if (idx >= 0) arr[idx] = result;
  else arr.push(result);
  saveResults(arr);
}

/* =========================================================
   6. MÃ HÓA KẾT QUẢ ĐỂ GỬI GIÁO VIÊN
   ========================================================= */
function b64urlEncodeUtf8(str){
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  for (const b of bytes) binary += String.fromCharCode(b);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function b64urlDecodeUtf8(code){
  let base64 = code.replace(/-/g, "+").replace(/_/g, "/");
  while (base64.length % 4) base64 += "=";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function encodeResult(obj){
  const copy = { ...obj };
  delete copy.code;
  return "PHX1." + b64urlEncodeUtf8(JSON.stringify(copy));
}

function decodeResult(code){
  if (typeof code !== "string" || !code.startsWith("PHX1.")) throw new Error("bad code");
  const obj = JSON.parse(b64urlDecodeUtf8(code.slice(5)));
  if (!obj || !Array.isArray(obj.answers) || !obj.student) throw new Error("bad result");
  return obj;
}

  stopTimer();
  const mode = opts.mode || "practice";
  const student = opts.student || "Học sinh";
  const className = opts.className || "Chưa rõ";
  const requireReflection = opts.requireReflection !== false;
  const questions = opts.questions && opts.questions.length ? opts.questions : getQuestions(mode);

  state = {
    mode,
    student,
    className,
    requireReflection,
    questions,
    current: 0,
    answers: [],
    reflections: {},
    start: Date.now(),
    timerId: null,
    answered: false,
    finished: false,
    qStart: 0,
    modeLabel: MODE_LABELS[mode] || mode
  };

  savePrefs(student, className);
  renderQuiz();
}

function startQuiz(){

function getQuestions(mode){

}

function bindQuizEvents(){
  document.querySelectorAll(".option").forEach((el, idx) => {
    el.addEventListener("click", () => selectOption(idx));
  });

  ["qtype", "infoType", "evidence"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", saveReflection);
  });

  document.querySelectorAll("[data-layer]").forEach(cb => {
    cb.addEventListener("change", saveReflection);
  });
}

function getReflectionFromDom(){
  return {
    qtype: document.getElementById("qtype")?.value || "",
    infoType: document.getElementById("infoType")?.value || "",
    evidence: (document.getElementById("evidence")?.value || "").trim(),
    layers: Array.from(document.querySelectorAll("[data-layer]:checked")).map(el => el.dataset.layer)
  };
}

function saveReflection(){
  if (!state || !state.questions) return;
  const q = state.questions[state.current];
  if (!q) return;
  state.reflections[q.id] = getReflectionFromDom();
}

function isReflectionComplete(ref){
  return !!(
    ref.qtype &&
    ref.infoType &&
    ref.evidence &&
    ref.evidence.length >= 2 &&
    Array.isArray(ref.layers) &&
    ref.layers.length === 4
  );
}

function selectOption(idx){
  if (!state || state.answered) return;
  const q = state.questions[state.current];
  if (!q) return;

  const ref = getReflectionFromDom();
  state.reflections[q.id] = ref;

  if (state.requireReflection && !isReflectionComplete(ref)){
    if (!ref.qtype) showToast("Bước 1: chọn từ hỏi (Who/What/Why...)");
    else if (!ref.infoType) showToast("Bước 2: chọn loại thông tin cần tìm");
    else if (ref.evidence.length < 2) showToast("Bước 3: ghi cụm từ khóa/bằng chứng");
    else showToast("Bước 4: đánh dấu đủ 4 lớp kiểm tra");
    return;
  }

  const correct = idx === q.answer;
  state.answered = true;
  stopTimer();

  const elapsed = Math.floor((Date.now() - state.qStart) / 1000);
  const answer = {
    qid: q.id,
    selected: idx,
    correct,
    elapsed,
    qtype: ref.qtype,
    infoType: ref.infoType,
    evidence: ref.evidence,
    layers: ref.layers,
    reflectionRequired: state.requireReflection,
    reflectionDone: state.requireReflection ? true : null
  };

  state.answers.push(answer);
  state.reflections[q.id] = ref;

  document.querySelectorAll(".option").forEach((el, i) => {
    el.disabled = true;
    if (i === q.answer) el.classList.add("correct");
    if (i === idx && !correct) el.classList.add("wrong");
  });

  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (correct ? "ok" : "bad");
  fb.innerHTML = renderFeedback(q, correct);

  document.getElementById("nextActions").innerHTML = `
    <button class="btn primary" onclick="nextQuestion()">
      ${state.current === state.questions.length - 1 ? "Xem kết quả" : "Câu tiếp theo"}
    </button>
  `;

  document.querySelectorAll("#reflectionPanel input, #reflectionPanel select").forEach(el => el.disabled = true);

  const progress = document.querySelector(".progress > div");
  if (progress) progress.style.width = `${((state.current + 1) / state.questions.length) * 100}%`;
}

function renderFeedback(q, correct){
  const correctLetter = String.fromCharCode(65 + q.answer);
  return `
    <div class="fb-title">${correct ? "✓ Chính xác" : "✗ Chưa đúng"}</div>
    <p><strong>Đáp án đúng:</strong> ${correctLetter}. ${escapeHtml(q.options[q.answer])}</p>
    <p><strong>Bằng chứng:</strong> “${escapeHtml(q.evidence)}”</p>
    <p><strong>Bẫy:</strong> ${escapeHtml(q.traps.join(" • "))}</p>
    <p><strong>Loại trừ:</strong> ${escapeHtml(q.elimination)}</p>
    <p><strong>Chiến lược:</strong> ${escapeHtml(q.strategy)}</p>
    <p><strong>Lớp quyết định:</strong> ${escapeHtml(q.layerFocus)}</p>
  `;
}

function nextQuestion(){
  if (!state) return;
  stopTimer();
  if (state.current >= state.questions.length - 1){
    finishQuiz();
    return;
  }
  state.current++;
  state.answered = false;
  renderQuiz();
}

/* =========================================================
   9. TÍNH TOÁN & KẾT QUẢ HỌC SINH
   ========================================================= */
function computeStats(result){
  const stats = {
    byDiff: {},
    byTrap: {},
    byTheme: {},
    reflectionReq: 0,
    reflectionDone: 0
  };

  (result.answers || []).forEach(a => {
    const q = QMAP[a.qid];
    if (!q) return;

    const d = q.diff || "Khác";
    stats.byDiff[d] = stats.byDiff[d] || { total: 0, correct: 0 };
    stats.byDiff[d].total++;
    if (a.correct) stats.byDiff[d].correct++;

    const t = q.theme || "Khác";
    stats.byTheme[t] = stats.byTheme[t] || { total: 0, correct: 0 };
    stats.byTheme[t].total++;
    if (a.correct) stats.byTheme[t].correct++;

    (q.traps || []).forEach(trap => {
      stats.byTrap[trap] = stats.byTrap[trap] || { total: 0, wrong: 0 };
      stats.byTrap[trap].total++;
      if (!a.correct) stats.byTrap[trap].wrong++;
    });

    if (a.reflectionRequired){
      stats.reflectionReq++;
      if (a.reflectionDone) stats.reflectionDone++;
    }
  });

  return stats;
}

function miniStat(label, total, correct){
  const pct = total ? Math.round(correct / total * 100) : 0;
  return `
    <div class="mini-stat">
      <div><span>${escapeHtml(label)}</span><strong>${pct}%</strong></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="small">${correct}/${total} câu</div>
    </div>
  `;
}

function finishQuiz(){
  stopTimer();
  if (!state) return;
  state.finished = true;

  const total = state.questions.length;
  const correctCount = state.answers.filter(a => a.correct).length;
  const durationSec = state.answers.reduce((sum, a) => sum + (a.elapsed || 0), 0);

  const result = {
    id: "r_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    student: state.student,
    className: state.className,
    mode: state.mode,
    modeLabel: state.modeLabel,
    dateISO: new Date().toISOString(),
    score: correctCount,
    total,
    percent: total ? Math.round(correctCount / total * 100) : 0,
    durationSec,
    answers: state.answers.slice()
  };

  result.code = encodeResult(result);
  lastResult = result;
  saveResult(result);
  renderResult(result);
}

function startRetestFromResult(){
  if (!lastResult) return;
  const wrong = (lastResult.answers || []).filter(a => !a.correct);
  const wrongQs = wrong.map(a => QMAP[a.qid]).filter(Boolean);
  const traps = new Set(wrongQs.flatMap(q => q.traps || []));

  let set = RETEST_24H.filter(q => (q.traps || []).some(t => traps.has(t)));
  if (set.length === 0) set = RETEST_24H.slice();

  beginQuiz({
    mode: "retest24",
    student: lastResult.student,
    className: lastResult.className,
    requireReflection: true,
    questions: set
  });
}

function startRetest7FromResult(){
  if (!lastResult) return;
  beginQuiz({
    mode: "retest7",
    student: lastResult.student,
    className: lastResult.className,
    requireReflection: true
  });
}

function startPersonalFromResult(){
  if (!lastResult) return;
  beginQuiz({
    mode: "personal",
    student: lastResult.student,
    className: lastResult.className,
    requireReflection: true
  });
}

function downloadLastResult(){
  if (lastResult) downloadResult(lastResult);
}

function copyLastResult(){
  if (lastResult) copyText(lastResult.code || encodeResult(lastResult));
}

function downloadResult(r){
  if (!r) return;
  const blob = new Blob([JSON.stringify(r, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  const safeName = String(r.student || "hoc-sinh").replace(/\s+/g, "-");
  a.href = URL.createObjectURL(blob);
  a.download = `ket-qua-${safeName}-${r.id || "result"}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast("Đã tải JSON");
}

/* =========================================================
   11. BÁO CÁO GIÁO VIÊN
   ========================================================= */
function aggregateResults(results){
  const stats = {
    attempts: results.length,
    totalPercent: 0,
    passCount: 0,
    avg: 0,
    passRate: 0,
    traps: {},
    questions: {},
    themes: {},
    reflectionReq: 0,
    reflectionDone: 0
  };

  results.forEach(r => {
    const pct = Number(r.percent) || 0;
    stats.totalPercent += pct;
    if (pct >= 80) stats.passCount++;

    (r.answers || []).forEach(a => {
      const q = QMAP[a.qid];
      if (!q) return;

      const qt = stats.questions[a.qid] || { total: 0, correct: 0, diff: q.diff, theme: q.theme };
      qt.total++;
      if (a.correct) qt.correct++;
      stats.questions[a.qid] = qt;

      const th = stats.themes[q.theme] || { total: 0, correct: 0 };
      th.total++;
      if (a.correct) th.correct++;
      stats.themes[q.theme] = th;

      (q.traps || []).forEach(trap => {
        const tr = stats.traps[trap] || { total: 0, wrong: 0 };
        tr.total++;
        if (!a.correct) tr.wrong++;
        stats.traps[trap] = tr;
      });

      if (a.reflectionRequired){
        stats.reflectionReq++;
        if (a.reflectionDone) stats.reflectionDone++;
      }
    });
  });

  stats.avg = results.length ? Math.round(stats.totalPercent / results.length) : 0;
  stats.passRate = results.length ? Math.round(stats.passCount / results.length * 100) : 0;
  return stats;
}

        <table>
          <thead><tr><th>Chủ đề</th><th>Đúng/Tổng</th><th>%</th></tr></thead>
          <tbody>${themeRows || `<tr><td colspan="3" class="empty">Chưa có dữ liệu.</td></tr>`}</tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Nhập mã kết quả từ học sinh</h2>
      <p class="small">
        Học sinh bấm “Sao chép mã” ở phiếu kết quả và gửi cho giáo viên.
        Dán mã bắt đầu bằng <b>PHX1.</b> vào ô dưới.
      </p>
      <textarea class="code-area" id="importCode" placeholder="Dán mã PHX1..."></textarea>
      <div class="toolbar" style="margin-top:10px">
        <button class="btn ghost" onclick="exportPDF()">📄 Xuất PDF kết quả</button>
      <button class="btn primary" onclick="importResult()">Nhập mã kết quả</button>
      </div>
      <p class="small">
        Nếu cùng một trình duyệt/máy, kết quả tự lưu và đã xuất hiện trong bảng trên.
      </p>
    </section>
  `;
}

function setTeacherClass(v){
  teacherClass = v;
  renderTeacher();
}

function copyResultByIndex(i){
  const r = teacherFiltered[i];
  if (!r) return;
  copyText(r.code || encodeResult(r));
}

function importResult(){
  const ta = document.getElementById("importCode");
  if (!ta) return;
  const code = ta.value.trim();
  if (!code){ showToast("Chưa có mã để nhập"); return; }

  try {
    const obj = decodeResult(code);
    obj.id = obj.id || "imp_" + Date.now();
    obj.code = code;

    const arr = getResults();
    const idx = arr.findIndex(x => x.id === obj.id);
    if (idx >= 0) arr[idx] = obj;
    else arr.push(obj);

    saveResults(arr);
    ta.value = "";
    renderTeacher();
    showToast("Đã nhập kết quả");
  } catch(e){
    showToast("Mã kết quả không hợp lệ");
  }
}

function exportCSV(){
  const data = teacherFiltered.length ? teacherFiltered : getResults();
  const rows = [
    ["Mã", "Ngày", "Học sinh", "Lớp", "Chế độ", "Điểm", "Tổng", "%", "Thời gian(s)", "Sai", "Phiếu phản xạ"]
  ];

  data.forEach(r => {
    const total = Number(r.total) || (r.answers || []).length || 0;
    const score = Number(r.score) || 0;
    const req = (r.answers || []).filter(a => a.reflectionRequired).length;
    const done = (r.answers || []).filter(a => a.reflectionRequired && a.reflectionDone).length;
    rows.push([
      r.id || "",
      formatDate(r.dateISO),
      r.student || "",
      r.className || "",
      r.modeLabel || MODE_LABELS[r.mode] || r.mode || "",
      score,
      total,
      Number(r.percent) || 0,
      Number(r.durationSec) || 0,
      Math.max(0, total - score),
      req ? `${done}/${req}` : "—"
    ]);
  });

  const csv = rows.map(row =>
    row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")
  ).join("\n");

  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `bao-cao-phan-xa-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast("Đã xuất CSV");
}

function clearResults(){
  if (!confirm("Xóa toàn bộ kết quả đã lưu trên trình duyệt này?")) return;
  try { localStorage.removeItem(LS_KEY); } catch(e){}
  memoryResults = [];
  teacherClass = "";
  renderTeacher();
  showToast("Đã xóa dữ liệu");
}

/* =========================================================
   12. ĐIỀU HƯỚNG & KHỞI TẠO
   ========================================================= */
function showSetup(){
  if (state && !state.finished && state.answers && state.answers.length > 0){
    if (!confirm("Bạn đang làm dở. Về màn hình bắt đầu sẽ mất tiến độ. Tiếp tục?")) return;
  }
  stopTimer();
  state = { finished: true };
  renderSetup();
}

function stopTimer(){
  if (state && state.timerId){
    clearInterval(state.timerId);
    state.timerId = null;
  }
}

function startTimer(){
  stopTimer();
  state.qStart = Date.now();
  updateTimer();
  state.timerId = setInterval(updateTimer, 1000);
}

function updateTimer(){
  if (!state || !state.qStart) return;
  const sec = Math.floor((Date.now() - state.qStart) / 1000);
  const el = document.getElementById("timer");
  if (el) el.textContent = formatTime(sec);
}

/* Khởi chạy */
renderSetup();
function exportPDF(){
  document.body.classList.add('print-result');
  window.print();
  setTimeout(()=>document.body.classList.remove('print-result'),500);
}
</script>
